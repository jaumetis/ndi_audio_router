name: Release

on:
  push:
    branches: [main]      # cada push a main publica una Release nova (v1.0.N)
    tags: ['v*']          # o una etiqueta manual, p. ex. v1.2.0
  workflow_dispatch:       # també es pot llançar a mà (genera només artefactes, no Release)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Versió
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v(\d+\.\d+\.\d+)') { $v = $Matches[1] } else { $v = "1.0.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publica l'executable
        shell: pwsh
        run: >
          dotnet publish NdiAudioRouter.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Instal·la Inno Setup (si no hi és)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "No es troba ISCC.exe" }

      - name: Genera l'instal·lador
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\NdiAudioRouter.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC ha fallat" }
          Copy-Item publish\NdiAudioRouter.exe "dist\NdiAudioRouter-portable-${{ steps.ver.outputs.version }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: NdiAudioRouter-${{ steps.ver.outputs.version }}
          path: dist/*.exe

      - name: Publica la Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: NDI Audio Router ${{ steps.ver.outputs.version }}
          files: dist/*.exe
          generate_release_notes: true
